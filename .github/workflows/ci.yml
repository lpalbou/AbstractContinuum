name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: abstractcontinuum
    steps:
      - name: Check out AbstractContinuum
        uses: actions/checkout@v4
        with:
          path: abstractcontinuum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: abstractcontinuum/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check app-server resolves
        run: node -e "import('@abstractframework/app-server').then(m => { for (const n of ['createGatewaySessionProxy', 'createMountedHandler', 'injectShell', 'requestContext', 'rejectUpgrade', 'resolveGatewayUrl', 'createGatewayUrlResolver']) if (typeof m[n] !== 'function') throw new Error(n + ' missing (app-server too old for the /apps/<id>/ mount)'); console.log('app-server OK'); })"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: |
          node bin/cli.js --version
          node bin/cli.js --help

      - name: Validate npm package contents
        run: npm pack --dry-run
